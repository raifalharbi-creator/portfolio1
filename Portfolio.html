<style>
/* ================= Tokens ================= */
:root {
  --bg: #F2F0EF;
  --fg: #16140f;
  --mut: #6b6259;
  --card: #ffffff;
  --soft: #E8E5E3;
  --accent: #8F75B5;
  --accent-hover: #685585;
  --rule: rgba(20,18,14,0.10);
  --hair: rgba(0,0,0,0.06);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --pad-x: 48px;
  --cs-pad-x: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); }
body { font-family: var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
img { max-width: 100%; }
a { color: inherit; }
.mono { font-family: var(--mono); }

/* ================= Purple cursor dot (desktop only) ================= */
.hero-dot {
  display: none;
  position: fixed; top: 0; left: 0;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent);
  mix-blend-mode: multiply; opacity: 0.85;
  pointer-events: none; z-index: 2147483647;
  transform: translate(-100px, -100px) translate(-50%, -50%);
  transition: width .12s, height .12s, opacity .12s;
}
.hero-dot.is-down { width: 24px; height: 24px; }
@media (min-width: 1200px) and (hover: hover) and (pointer: fine) {
  .hero-dot { display: block; }
}

/* ================= Scroll reveal ================= */
.reveal { opacity: 0; transform: translateY(24px); }
.reveal.seen {
  opacity: 1; transform: translateY(0);
  transition: opacity 700ms cubic-bezier(.2,.7,.2,1) var(--reveal-delay, 0ms),
              transform 700ms cubic-bezier(.2,.7,.2,1) var(--reveal-delay, 0ms);
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* ================= Nav ================= */
.page { padding: 24px var(--pad-x) 0; width: 100%; min-height: 100%; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; gap: 16px; flex-wrap: wrap; }
.nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; }
.nav-brand-dot { width: 28px; height: 28px; border-radius: 14px; background: var(--accent); display: inline-block; }
.nav-name { font-size: 29px; font-weight: 600; letter-spacing: -0.6px; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-link { color: var(--mut); text-decoration: none; cursor: pointer; font-weight: 500; font-size: 18px; position: relative; }
.nav-link:hover { color: var(--fg); }
.nav-link.active { color: var(--fg); }
.nav-link.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: var(--accent); }
.nav-cta { background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 18px; font-weight: 500; white-space: nowrap; transition: background .15s; }
.nav-cta:hover { background: var(--accent-hover); color: #fff; }
@media (max-width: 1024px) {
  :root { --pad-x: 32px; --cs-pad-x: 40px; }
  .nav-link, .nav-cta { font-size: 16px; }
  .nav-links { gap: 20px; }
  .nav-name { font-size: 26px; }
}
@media (max-width: 720px) {
  .nav { flex-direction: row; }
  .nav-links { width: 100%; justify-content: flex-start; gap: 18px; padding: 10px 0 12px; border-bottom: 0.5px solid var(--rule); overflow-x: auto; }
  .nav-link.active::after { bottom: -6px; }
  .nav-cta { font-size: 15px; padding: 7px 13px; }
  .nav-name { font-size: 24px; }
  .nav-brand-dot { width: 24px; height: 24px; }
}
@media (max-width: 640px) {
  :root { --pad-x: 20px; --cs-pad-x: 20px; }
  .nav-link { font-size: 15px; }
}

/* ================= Home: hero ================= */
.hero { padding: 72px 0 60px; max-width: 1240px; }
.hero-h1 { font-size: clamp(42px, 7.3vw, 84px); line-height: 1.1; letter-spacing: -0.036em; font-weight: 600; margin: 0; }
.hero-h1 .h-mut { color: var(--mut); }
.hero-h1 .h-acc { color: var(--accent); }
.hero-meta { display: flex; align-items: center; gap: 14px; margin-top: 32px; font-size: 14px; font-family: var(--mono); color: var(--mut); flex-wrap: wrap; }
@media (max-width: 860px) { .hero { padding: 56px 0 44px; } .hero-meta { margin-top: 24px; font-size: 13px; } }
@media (max-width: 640px) {
  .hero { padding: 40px 0 36px; }
  .hero-meta { font-size: 12px; gap: 10px; }
  .hero-meta .dotsep { display: none; }
  .hero-meta { flex-direction: column; align-items: flex-start; gap: 6px; }
}

/* ================= Home: work tiles ================= */
.work-section { padding: 40px 0; }
.work-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.work-h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 600; letter-spacing: -1px; margin: 0; }
.work-count { font-family: var(--mono); font-size: 12px; letter-spacing: 0.4px; color: var(--mut); }
.tiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.tile-wrap.big { grid-column: span 2; }
.tile {
  border-radius: 18px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; height: 100%;
  background: var(--card);
  box-shadow: 0 1px 2px rgba(20,18,14,0.06);
  transition: box-shadow .2s, transform .2s;
  text-decoration: none;
}
.tile:hover { box-shadow: 0 12px 40px rgba(20,18,14,0.12); transform: translateY(-3px); }
.tile-media { position: relative; }
.tile-chip, .row-chip {
  position: absolute; top: 14px; left: 14px;
  background: #fff; color: #16140f; padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-family: var(--mono); letter-spacing: 0.4px; font-weight: 500;
}
.tile-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
.tile-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.tile-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin: 0; }
.tile-type { font-size: 13px; font-family: var(--mono); color: var(--mut); }
.tile-subtitle { font-size: 16px; font-weight: 500; line-height: 1.35; margin: 4px 0 8px; letter-spacing: -0.2px; text-wrap: balance; }
.tile-blurb { font-size: 14px; line-height: 1.55; margin: 0 0 16px; color: var(--mut); text-wrap: pretty; }
.tile-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.tag { font-size: 11px; padding: 3px 9px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 999px; font-family: var(--mono); letter-spacing: 0.3px; white-space: nowrap; color: var(--mut); }
.tile-cta { flex: 1 1 auto; text-align: right; color: var(--accent); font-size: 14px; font-weight: 500; opacity: 0.6; transition: opacity .15s; white-space: nowrap; }
.tile:hover .tile-cta { opacity: 1; }
@media (max-width: 720px) {
  .tiles-grid { grid-template-columns: 1fr; gap: 18px; }
  .tile-wrap.big { grid-column: auto; }
}

/* Placeholder (striped wordmark cover) */
.ph {
  width: 100%; position: relative; overflow: hidden;
  display: flex; align-items: flex-end; padding: 14px;
  color: var(--ph-ink);
  background: repeating-linear-gradient(135deg, var(--ph-bg) 0, var(--ph-bg) 22px, var(--ph-stripe) 22px, var(--ph-stripe) 23px);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10.5px; letter-spacing: 0.6px; text-transform: uppercase;
}
.ph.plum { --ph-bg: #ece4ec; --ph-stripe: rgba(110,60,110,0.10); --ph-ink: #5a3760; }
.ph.sage { --ph-bg: #e3eae0; --ph-stripe: rgba(70,100,70,0.10); --ph-ink: #3d5a3d; }
.ph.tangerine { --ph-bg: #f3e2d0; --ph-stripe: rgba(170,90,30,0.12); --ph-ink: #7a4516; }
.ph-wordmark {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  text-transform: none; letter-spacing: -0.04em; font-family: var(--sans);
  font-size: clamp(44px, 8vw, 88px); font-weight: 600;
}
.ph-label { background: #faf8f3; padding: 4px 8px; border: 0.5px solid var(--ph-ink); position: relative; z-index: 1; }
.tile-media .ph { height: 220px; }
.tile-wrap.big .tile-media .ph { height: 360px; }
@media (max-width: 720px) { .tile-media .ph, .tile-wrap.big .tile-media .ph { height: 220px; } }

/* ================= Home: about strip ================= */
.about-strip { padding: 72px 0; }
.about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; color: var(--accent); }
.about-kicker { display: block; line-height: 24.75px; }
.about-h2 { font-family: var(--sans); font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15; font-weight: 500; letter-spacing: -0.5px; margin: 12px 0 0; text-wrap: balance; }
.about-right { padding-top: 41px; }
.about-p { font-size: 16px; line-height: 1.65; margin: 0 0 14px; color: var(--mut); text-wrap: pretty; }
@media (max-width: 860px) {
  .about-strip { padding: 48px 0; }
  .about-grid { grid-template-columns: 1fr; gap: 24px; }
  .about-right { padding-top: 0; }
}

/* ================= Footer ================= */
.footer { margin: 40px calc(-1 * var(--pad-x)) 0; padding: 64px var(--pad-x) 32px; background: var(--fg); color: var(--bg); }
.footer-inner { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: start; }
.footer-h3 { font-size: clamp(32px, 5vw, 56px); font-weight: 500; letter-spacing: -1.5px; margin: 0; text-wrap: balance; line-height: 1.05; }
.footer-h3 .h-acc { color: var(--accent); }
.footer-links { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.footer-link { display: flex; flex-direction: column; gap: 4px; text-decoration: none; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.15); color: var(--bg); min-width: 0; }
.footer-link .fl-label { opacity: 0.5; font-size: 12px; }
.footer-link .fl-value { font-size: 18px; overflow-wrap: anywhere; }
.footer-link:hover .fl-value { color: var(--accent); }
.footer-bottom { display: flex; justify-content: space-between; gap: 12px; margin-top: 64px; padding-top: 18px; border-top: 0.5px solid rgba(255,255,255,0.15); font-family: var(--mono); font-size: 11px; letter-spacing: 0.4px; opacity: 0.6; flex-wrap: wrap; }
@media (max-width: 900px) { .footer-inner { grid-template-columns: 1fr; gap: 36px; } }
@media (max-width: 640px) {
  .footer { padding-top: 44px; }
  .footer-links { grid-template-columns: 1fr; gap: 8px; }
  .footer-link .fl-value { font-size: 16px; }
  .footer-bottom { margin-top: 40px; }
}

/* ================= Work page ================= */
.intro { padding: 72px 0 56px; max-width: 1240px; }
.intro-h1 { font-size: clamp(36px, 6vw, 72px); line-height: 1.08; letter-spacing: -0.035em; font-weight: 600; margin: 14px 0 24px; text-wrap: balance; }
.intro-h1 .h-mut { color: var(--mut); }
.intro-lead { font-size: clamp(16px, 2vw, 19px); line-height: 1.55; max-width: 760px; margin: 0; color: var(--mut); text-wrap: pretty; }
.meta-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; padding: 20px 0; margin-top: 40px; border-top: 0.5px solid var(--rule); border-bottom: 0.5px solid var(--rule); }
.meta-cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.meta-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mut); }
.meta-value { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; }
.meta-value.acc { color: var(--accent); }
@media (max-width: 900px) { .meta-strip { grid-template-columns: repeat(2, 1fr); gap: 20px 24px; } .intro { padding: 56px 0 40px; } }
@media (max-width: 420px) { .meta-strip { grid-template-columns: 1fr; gap: 16px; } }

.rows { padding: 24px 0 64px; display: flex; flex-direction: column; gap: 32px; }
.row {
  display: grid; grid-template-columns: 1.05fr 1fr; border-radius: 22px; overflow: hidden;
  cursor: pointer; background: var(--card); text-decoration: none;
  box-shadow: 0 1px 2px rgba(20,18,14,0.05);
  transition: box-shadow .2s, transform .2s;
}
.row:hover { box-shadow: 0 12px 40px rgba(20,18,14,0.10); transform: translateY(-2px); }
.row-media { position: relative; min-height: 420px; }
.row-media .ph { position: absolute; inset: 0; height: 100%; }
.row-body { padding: 32px 36px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.row-h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; letter-spacing: -0.8px; margin: 0; }
.row-type { font-size: 13px; font-family: var(--mono); color: var(--mut); }
.row-subtitle { font-size: 18px; font-weight: 500; line-height: 1.35; margin: 0; letter-spacing: -0.2px; text-wrap: balance; }
.row-meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 24px; padding: 14px 0; border-top: 0.5px solid var(--rule); border-bottom: 0.5px solid var(--rule); }
.row-blurb { font-size: 15px; line-height: 1.65; margin: 0; color: var(--mut); text-wrap: pretty; }
.row-outcomes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.outcome { padding: 12px 14px; border: 0.5px solid var(--rule); border-radius: 12px; min-width: 0; }
.outcome-v { font-size: 22px; font-weight: 600; letter-spacing: -0.6px; }
.outcome-k { font-size: 11px; font-family: var(--mono); letter-spacing: 0.4px; text-transform: uppercase; margin-top: 2px; color: var(--mut); }
.row-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
.row-cta { color: var(--accent); font-weight: 500; font-size: 15px; opacity: 0.7; transition: opacity .15s; white-space: nowrap; }
.row:hover .row-cta { opacity: 1; }
@media (max-width: 980px) {
  .row { grid-template-columns: 1fr; }

}
@media (max-width: 560px) {

}

.closing { padding: 40px 0 80px; }
.closing-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding-top: 40px; border-top: 0.5px solid var(--rule); }
.closing-p { font-size: clamp(18px, 2.2vw, 22px); line-height: 1.4; margin: 14px 0 0; font-weight: 500; letter-spacing: -0.3px; text-wrap: pretty; }
.not-list { font-size: 15px; line-height: 1.7; margin: 14px 0 0; padding-left: 18px; color: var(--mut); }
@media (max-width: 860px) { .closing-inner { grid-template-columns: 1fr; gap: 32px; } .closing { padding-bottom: 56px; } }

/* ================= About page ================= */
.a-hero { padding: 72px 0 64px; display: grid; grid-template-columns: 2.2fr 1fr; gap: 48px; align-items: start; max-width: 1240px; }
.a-hero-h1 { font-size: clamp(36px, 6vw, 76px); line-height: 1.08; letter-spacing: -0.033em; font-weight: 600; margin: 14px 0 0; text-wrap: balance; }
.a-hero-h1 .h-mut { color: var(--mut); }
.a-aside { padding-top: 32px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; color: var(--mut); }
.aside-row { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: baseline; }
.aside-key { font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; opacity: 0.7; }
.aside-val { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; }
.aside-val.acc { color: var(--accent); }
@media (max-width: 900px) { .a-hero { grid-template-columns: 1fr; gap: 32px; padding: 56px 0 44px; } .a-aside { padding-top: 0; } }

.a-section { padding: 64px 0; border-top: 0.5px solid var(--rule); }
.a-h2 { font-size: clamp(28px, 3.6vw, 44px); font-weight: 600; letter-spacing: -1.2px; margin: 8px 0 0; line-height: 1.1; text-wrap: balance; }
.a-section-header { margin-bottom: 20px; }
.bio-section { display: grid; grid-template-columns: 0.72fr 1.7fr; gap: 56px; align-items: start; }
.bio-section .a-section-header { margin-bottom: 0; }
.bio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px 56px; max-width: 1100px; align-items: start; }
.bio-col { display: flex; flex-direction: column; gap: 24px; }
.bio-p { font-size: 17px; line-height: 1.55; margin: 0; text-wrap: pretty; font-weight: 400; }

@media (max-width: 1024px) { .bio-section { grid-template-columns: 1fr; gap: 24px; } }
@media (max-width: 720px) { .bio-grid { grid-template-columns: 1fr; gap: 20px; } .a-section { padding: 44px 0; } }

.current-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.current-card { padding: 24px 28px; border-radius: 18px; border: 0.5px solid var(--rule); background: var(--card); }
.current-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.current-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.current-tag { font-size: 19px; font-weight: 600; letter-spacing: -0.4px; }
.current-role { font-size: 13px; font-family: var(--mono); color: var(--mut); }
.current-body { font-size: 15px; line-height: 1.6; margin: 0; color: var(--mut); text-wrap: pretty; }
@media (max-width: 720px) { .current-grid { grid-template-columns: 1fr; gap: 14px; } .current-card { padding: 20px 20px; } }

.principles { display: flex; flex-direction: column; }
.principle { display: grid; grid-template-columns: 64px 1fr; gap: 24px; padding: 28px 0; align-items: baseline; border-top: 0.5px solid var(--rule); }
.principle-n { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.6px; color: var(--accent); }

.principle-body { font-size: 16px; line-height: 1.6; margin: 0; max-width: 720px; color: var(--mut); text-wrap: pretty; }

.process-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.off-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 56px; max-width: 1100px; }

.a-closing { padding: 40px 0 80px; }

/* ================= Shared building blocks ================= */

function navHTML(active) {
  function link(key, label) {
    return '<a class="nav-link' + (active === key ? ' active' : '') + '" href="#' + (key === 'home' ? '' : key) + '">' + label + '</a>';
  }
  return '<header class="nav">' +
    '<a class="nav-brand" href="#" aria-label="Home">' +
    '<span class="nav-brand-dot"></span><span class="nav-name">Raif</span></a>' +
    '<nav class="nav-links" aria-label="Main">' +
    link('home', 'Home') + link('work', 'Work') + link('about', 'About') +
    '<a class="nav-link" href="' + RAIF.resume + '" target="_blank" rel="noopener noreferrer">Resume</a>' +
    '<a class="nav-cta" href="mailto:' + RAIF.email + '">Say hi →</a>' +
    '</nav></header>';
}

function footerHTML() {
  var links = RAIF.links.map(function (l) {
    var ext = l.href.indexOf('http') === 0;
    return '<a class="footer-link" href="' + l.href + '"' + (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
      '<span class="fl-label">' + esc(l.label) + '</span>' +
      '<span class="fl-value">' + esc(l.value) + ' →</span></a>';
  }).join('');
  return '<footer class="footer">' +
    '<div class="footer-inner">' +
    '<h3 class="footer-h3">Got a project? <span class="h-acc">Let’s talk.</span></h3>' +
    '<div class="footer-links">' + links + '</div></div>' +
    '<div class="footer-bottom"><span>© 2026</span><span>Hand-built · no templates</span><span>v1.0</span></div>' +
    '</footer>';
}

function placeholderHTML(ph) {
  return '<div class="ph ' + ph.variant + '">' +
    (ph.wordmark ? '<div class="ph-wordmark">' + esc(ph.wordmark) + '</div>' : '') +
    '<span class="ph-label">' + esc(ph.label) + '</span></div>';
}

function macFrame(srcKey, alt, caption) {
  return '<div class="mac">' +
    '<div class="mac-lid"><div class="mac-notch"></div><div class="mac-cam"></div>' +
    '<div class="mac-screen"><img src="' + IMG[srcKey] + '" alt="' + esc(alt || '') + '"/><div class="mac-sheen"></div></div>' +
    '</div>' +
    '<div class="mac-base"><div class="mac-hinge"></div><div class="mac-lip"></div><div class="mac-shadow"></div></div>' +
    (caption ? '<div class="mac-caption">' + esc(caption) + '</div>' : '') +
    '</div>';
}

function rawShot(srcKey, label, alt) {
  return '<figure class="rawshot">' +
    (label ? '<figcaption class="rawshot-label">' + esc(label) + '</figcaption>' : '') +
    '<div class="rawshot-img"><img src="' + IMG[srcKey] + '" alt="' + esc(alt || '') + '"/></div>' +

/* Scroll reveal */
function initReveal() {
  var els = app.querySelectorAll('.reveal');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || !('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('seen'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -10% 0px', threshold: 0.1 });
  els.forEach(function (el) { io.observe(el); });
}

/* Purple cursor dot: rendered only on desktop/laptop with a fine pointer (see CSS) */
(function () {
  var dot = document.getElementById('heroDot');
  if (!dot) return;
  var mq = window.matchMedia('(min-width: 1200px) and (hover: hover) and (pointer: fine)');
  var attached = false;
  function move(e) { dot.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) translate(-50%,-50%)'; }
  function down() { dot.classList.add('is-down'); }
  function up() { dot.classList.remove('is-down'); }
  function sync() {
    if (mq.matches && !attached) {
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerdown', down);
      window.addEventListener('pointerup', up);
      attached = true;
    } else if (!mq.matches && attached) {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerdown', down);
      window.removeEventListener('pointerup', up);
      attached = false;
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', sync); else if (mq.addListener) mq.addListener(sync);
  sync();
})();

window.addEventListener('hashchange', renderRoute);
renderRoute();
